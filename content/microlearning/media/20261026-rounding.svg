<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><rect x="0" y="0" width="720" height="440" rx="0" fill="#f6f2e9"/><g font-family="sans-serif"><text x="35" y="45" font-size="27" fill="#264c55" text-anchor="start">Arrotondamento IEEE 754 · binary64</text><text x="35" y="105" font-size="26" fill="#264c55" text-anchor="start">Numeri rappresentabili vicino a 10¹⁶</text><path d="M80,200 L640,200" fill="none" stroke="#264c55" stroke-width="3"/><circle cx="100" cy="200" r="7" fill="#264c55"/><text x="100" y="250" font-size="24" fill="#264c55" text-anchor="middle">10¹⁶</text><circle cx="360" cy="200" r="7" fill="#264c55"/><text x="360" y="250" font-size="24" fill="#264c55" text-anchor="middle">10¹⁶ + 2</text><circle cx="620" cy="200" r="7" fill="#264c55"/><text x="620" y="250" font-size="24" fill="#264c55" text-anchor="middle">10¹⁶ + 4</text><circle cx="230" cy="200" r="7" fill="#bc5738"/><text x="230" y="160" font-size="26" fill="#bc5738" text-anchor="middle">10¹⁶ + 1</text><path d="M230,185 L110,185" fill="none" stroke="#bc5738" stroke-width="3"/><polyline points="123.16,177.81 110.00,185.00 123.16,192.19" fill="none" stroke="#bc5738" stroke-width="3"/><text x="35" y="330" font-size="31" fill="#264c55" text-anchor="start">(10¹⁶ + 1) − 10¹⁶ = 0</text><text x="35" y="385" font-size="30" fill="#bc5738" text-anchor="start">Risultato reale: 1</text><text x="35" y="428" font-size="24" fill="#264c55" text-anchor="start">Il primo arrotondamento ha già perso l’unità</text></g></svg>