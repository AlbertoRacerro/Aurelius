<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><rect x="0" y="0" width="720" height="440" rx="0" fill="#f5f4eb"/><text x="35" y="50" font-family="sans-serif" font-size="23" fill="#203b42" text-anchor="start">Tre celle, un solo confine condiviso</text><rect x="90" y="120" width="180" height="150" rx="0" fill="#d8e8ea"/><text x="180" y="205" font-family="sans-serif" font-size="32" fill="#203b42" text-anchor="middle">A</text><rect x="270" y="120" width="180" height="150" rx="0" fill="#e5e9d4"/><text x="360" y="205" font-family="sans-serif" font-size="32" fill="#203b42" text-anchor="middle">B</text><rect x="450" y="120" width="180" height="150" rx="0" fill="#edddd0"/><text x="540" y="205" font-family="sans-serif" font-size="32" fill="#203b42" text-anchor="middle">C</text><line x1="270" y1="105" x2="270" y2="285" stroke="#203b42" stroke-width="4"/><line x1="450" y1="105" x2="450" y2="285" stroke="#203b42" stroke-width="4"/><text x="270" y="320" font-family="sans-serif" font-size="24" fill="#203b42" text-anchor="middle">−F₁ + F₁ = 0</text><text x="540" y="320" font-family="sans-serif" font-size="24" fill="#203b42" text-anchor="middle">−F₂ + F₂ = 0</text><text x="360" y="375" font-family="sans-serif" font-size="23" fill="#203b42" text-anchor="middle">Nel totale restano solo i flussi esterni</text><text x="30" y="421" font-family="sans-serif" font-size="18" fill="#203b42" text-anchor="start">Schema di bilancio · F = portata attraverso una faccia</text></svg>