<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><rect x="0" y="0" width="720" height="440" rx="0" fill="#f6f3eb" stroke="none"/><text x="36" y="50" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#223b3c" text-anchor="start">x = [1000, 1001]</text><text x="36" y="98" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#223b3c" text-anchor="start">m = 1001</text><text x="36" y="147" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#223b3c" text-anchor="start">x − m = [−1, 0]</text><rect x="390" y="90" width="270" height="190" rx="8" fill="#dde8e1" stroke="none"/><text x="415" y="130" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#223b3c" text-anchor="start">exp(−1) ≈ 0,368</text><rect x="415" y="148" width="73.6" height="30" rx="8" fill="#bd7957" stroke="none"/><text x="415" y="215" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#223b3c" text-anchor="start">exp(0) = 1</text><rect x="415" y="232" width="200" height="30" rx="8" fill="#467a73" stroke="none"/><text x="36" y="327" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#223b3c" text-anchor="start">m + log(1 + e⁻¹)</text><text x="36" y="374" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#223b3c" text-anchor="start">≈ 1001,313</text><text x="32" y="417" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#637574" text-anchor="start">Esempio numerico · logaritmo naturale</text></svg>