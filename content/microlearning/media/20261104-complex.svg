<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><rect x="0" y="0" width="720" height="440" rx="5" fill="#f4f0e6" stroke="none" stroke-width="3"/><text x="40" y="44" font-family="sans-serif" font-size="26" fill="#253a40" text-anchor="start">Derivare x² con un passo immaginario</text><line x1="95" y1="305" x2="620" y2="305" stroke="#253a40" stroke-width="3"/><line x1="180" y1="365" x2="180" y2="95" stroke="#253a40" stroke-width="3"/><circle cx="420" cy="180" r="8" fill="#c35d42"/><line x1="420" y1="305" x2="420" y2="180" stroke="#c35d42" stroke-width="3" stroke-dasharray="7 6"/><text x="432" y="180" font-family="sans-serif" font-size="26" fill="#c35d42" text-anchor="start">1 + ih</text><text x="420" y="337" font-family="sans-serif" font-size="24" fill="#253a40" text-anchor="middle">1</text><text x="122" y="183" font-family="sans-serif" font-size="25" fill="#c35d42" text-anchor="start">ih</text><text x="590" y="340" font-family="sans-serif" font-size="22" fill="#253a40" text-anchor="start">Re</text><text x="190" y="103" font-family="sans-serif" font-size="22" fill="#253a40" text-anchor="start">Im</text><text x="360" y="375" font-family="sans-serif" font-size="27" fill="#253a40" text-anchor="middle">(1 + ih)² = 1 − h² + 2ih</text><text x="360" y="416" font-family="sans-serif" font-size="27" fill="#087e83" text-anchor="middle">Im[f(1 + ih)] / h = 2</text></svg>