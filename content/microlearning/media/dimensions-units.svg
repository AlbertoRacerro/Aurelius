<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Esponenti dimensionali OpenFOAM per la viscosità cinematica e conversione m-mm</title><rect width="720" height="440" fill="#f7f8f4"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#243c46" font-size="27" text-anchor="start">Un numero porta con sé le dimensioni</text><text x="360" y="142" fill="#245a60" font-size="34" text-anchor="middle">[ 0   2  −1   0   0   0   0 ]</text><text x="360" y="192" fill="#243c46" font-size="24" text-anchor="middle">M    L    T    Θ    N    I    J</text><text x="360" y="266" fill="#245a60" font-size="40" text-anchor="middle">L² / T  →  m²/s</text><text x="360" y="318" fill="#243c46" font-size="24" text-anchor="middle">Viscosità cinematica</text><text x="360" y="386" fill="#cd6c3d" font-size="23" text-anchor="middle">1 m = 1000 mm · stessa dimensione, scala diversa</text></g></svg>