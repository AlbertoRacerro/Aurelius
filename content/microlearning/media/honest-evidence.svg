<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Esempio schematico: un dato discordante non va nascosto perché contraddice l’ipotesi</title><rect width="720" height="440" fill="#f7f8f4"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#243c46" font-size="28" text-anchor="start">Mostrare anche ciò che non torna</text><path d="M80 345L650 345" stroke="#245a60" stroke-width="3" fill="none"/><path d="M80 345L80 90" stroke="#245a60" stroke-width="3" fill="none"/><path d="M100 310L620 120" stroke="#245a60" stroke-width="4" fill="none"/><circle cx="120" cy="300" r="8" fill="#245a60"/><circle cx="200" cy="275" r="8" fill="#245a60"/><circle cx="280" cy="244" r="8" fill="#245a60"/><circle cx="360" cy="210" r="8" fill="#245a60"/><circle cx="440" cy="186" r="8" fill="#245a60"/><circle cx="500" cy="290" r="8" fill="#cd6c3d"/><circle cx="590" cy="140" r="8" fill="#245a60"/><text x="470" y="330" fill="#cd6c3d" font-size="22" text-anchor="start">Il punto scomodo</text><text x="360" y="408" fill="#243c46" font-size="20" text-anchor="middle">Dati inventati per illustrare un principio, non una misura</text></g></svg>