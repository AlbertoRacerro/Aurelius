<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Soluzione fabbricata u=1+x²+2y² per Poisson: f=-6 e valori coerenti sul bordo</title><rect width="720" height="440" fill="#f7f8f4"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#243c46" font-size="27" text-anchor="start">Una soluzione esatta costruita a tavolino</text><text x="360" y="124" fill="#245a60" font-size="32" text-anchor="middle">u(x, y) = 1 + x² + 2y²</text><text x="360" y="198" fill="#cd6c3d" font-size="32" text-anchor="middle">−Δu = −(2 + 4) = −6</text><text x="360" y="267" fill="#243c46" font-size="28" text-anchor="middle">f = −6 · bordo: u esatta</text><path d="M80 302L640 302" stroke="#ccd5d0" stroke-width="2" fill="none"/><text x="360" y="350" fill="#245a60" font-size="29" text-anchor="middle">Solver → uₕ → confronto con u</text><text x="360" y="405" fill="#243c46" font-size="22" text-anchor="middle">Verifica numerica con risposta nota</text></g></svg>