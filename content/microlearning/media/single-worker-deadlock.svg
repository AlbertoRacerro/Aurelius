<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>A occupa l’unico worker aspettando B, che resta in coda: dipendenza circolare</title><rect width="720" height="440" fill="#f7f8f4"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#243c46" font-size="27" text-anchor="start">Un solo worker, nessuno può avanzare</text><rect x="40" y="105" width="270" height="205" rx="20" fill="#e0ebe8" stroke="#245a60" stroke-width="3"/><text x="175" y="146" fill="#245a60" font-size="24" text-anchor="middle">Worker unico</text><rect x="80" y="190" width="190" height="70" rx="14" fill="#cd6c3d" fill-opacity=".09" stroke="#cd6c3d" stroke-width="2"/><text x="175.0" y="233.0" fill="#cd6c3d" font-size="23" text-anchor="middle">A: attende B</text><rect x="445" y="190" width="230" height="70" rx="14" fill="#245a60" fill-opacity=".09" stroke="#245a60" stroke-width="2"/><text x="560.0" y="233.0" fill="#245a60" font-size="23" text-anchor="middle">B: in coda</text><path d="M270 225L445 225" stroke="#cd6c3d" stroke-width="3" fill="none"/><path d="M435 219L445 225L435 231" stroke="#cd6c3d" stroke-width="3" fill="none"/><path d="M560 260L560 330" stroke="#245a60" stroke-width="3" fill="none"/><path d="M560 330L175 330" stroke="#245a60" stroke-width="3" fill="none"/><text x="360" y="385" fill="#243c46" font-size="23" text-anchor="middle">B aspetta che A liberi il worker.</text><text x="360" y="421" fill="#cd6c3d" font-size="23" text-anchor="middle">A aspetta che B finisca.</text></g></svg>