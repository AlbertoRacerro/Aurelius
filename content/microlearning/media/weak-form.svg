<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Poisson: dall’equazione puntuale alla forma debole con v nulla sul bordo</title><rect width="720" height="440" fill="#f7f8f4"/><g font-family="Arial, sans-serif"><text x="35" y="48" fill="#243c46" font-size="27" text-anchor="start">Stesso problema, diversa richiesta</text><text x="45" y="113" fill="#245a60" font-size="44" text-anchor="start">−Δu = f</text><text x="45" y="151" fill="#243c46" font-size="23" text-anchor="start">Punto per punto</text><path d="M45 183L675 183" stroke="#ccd5d0" stroke-width="2" fill="none"/><text x="45" y="247" fill="#245a60" font-size="34" text-anchor="start">∫ ∇u · ∇v dΩ = ∫ f v dΩ</text><text x="45" y="292" fill="#243c46" font-size="24" text-anchor="start">Derivate prime + funzioni di prova</text><text x="45" y="344" fill="#243c46" font-size="21" text-anchor="start">Poisson · bordo di Dirichlet · v = 0 sul bordo</text><text x="45" y="398" fill="#243c46" font-size="20" text-anchor="start">Il termine di bordo si annulla in questo caso.</text></g></svg>